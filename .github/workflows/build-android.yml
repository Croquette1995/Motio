name: Build Flutter Android

on:
  push:
    branches: [ main, master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch: # Permet de lancer le build manuellement depuis l'onglet Actions

permissions:
  contents: write

env:
  # true uniquement sur push de main/master ou tag v* : les APKs et la release
  # sont alors produits. Sur dev et les PRs : analyse + tests uniquement.
  RELEASE_ENABLED: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
  # true sur push de dev ou déclenchement manuel : les APKs sont construits et
  # déposés en artifact GitHub Actions, sans créer ni modifier de release.
  DEV_ARTIFACT_ENABLED: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze & Test
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Extract version from pubspec.yaml
        id: version
        if: ${{ env.RELEASE_ENABLED == 'true' }}
        run: |
          FULL="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//')"
          VERSION="${FULL%%+*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version extraite : $VERSION"

          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::warning::Le tag ${GITHUB_REF_NAME} ne correspond pas à la version de pubspec.yaml (v$VERSION)"
          fi

      - name: Compute short SHA
        if: ${{ env.DEV_ARTIFACT_ENABLED == 'true' }}
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build APK
        if: ${{ env.RELEASE_ENABLED == 'true' || env.DEV_ARTIFACT_ENABLED == 'true' }}
        run: flutter build apk --split-per-abi

      - name: Rename APKs with version
        if: ${{ steps.version.outputs.version != '' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd build/app/outputs/flutter-apk
          for APK in app-*-release.apk; do
            [[ -e "$APK" ]] || continue
            ABI="${APK#app-}"
            ABI="${ABI%-release.apk}"
            mv "$APK" "Motio-${VERSION}-${ABI}.apk"
          done
          ls -1

      - name: Upload APKs
        if: ${{ steps.version.outputs.version != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: motio-apk-${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/Motio-*.apk
          retention-days: 7

      - name: Upload APKs (dev artifact)
        if: ${{ env.DEV_ARTIFACT_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: motio-apk-dev-${{ env.short_sha }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 7

      - name: Publish APKs to GitHub Release
        if: ${{ steps.version.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="Motio ${VERSION}"
          else
            TAG="latest"
            TITLE="Motio ${VERSION} (latest)"
          fi
          NOTES="Motio ${VERSION} - Build automatique (${GITHUB_SHA::7}) - ${GITHUB_REF_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/app/outputs/flutter-apk/Motio-*.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" build/app/outputs/flutter-apk/Motio-*.apk \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
