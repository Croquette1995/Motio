name: lexiflow
description: "Motio - Application d'apprentissage de vocabulaire anglais (A1-B2) avec répétition espacée et écriture manuscrite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI (Riverpod)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.0.0

  # ML Kit Digital Ink Recognition
  google_mlkit_digital_ink_recognition: ^0.13.0

  # Network & REST API
  dio: ^5.8.0

  # Database & Persistence (Drift multiplateforme)
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.5
  path: ^1.9.1
  google_fonts: ^6.2.1
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.5
  unorm_dart: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.13
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/motio_logo.png
